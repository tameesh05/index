<!DOCTYPE html> 
<html lang="en"> 
<head> 
 <meta charset="UTF-8"> 
 <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 <title>Responsive Product Grid</title> 
 <style> 
 * { 
 margin: 0; 
 padding: 0; 
 box-sizing: border-box; 
 font-family: Arial, sans-serif; 
} 
body { 
 padding: 20px; 
 background: #f5f5f5; 
 font-family: Arial,sans-serif; 
} 
.title { 
 text-align: center; 
 margin-bottom: 20px; 
 font-size: 26px; 
} 
.grid-container { 
 display: grid; 
 grid-template-columns: repeat(4, 1fr); 
 gap: 20px; 
} 
.product-card { 
 background: #Ư f; 
 border-radius: 8px; 
 box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
 padding: 16px; 
 text-align: center; 
} 
.product-card img { 
 width: 100%; 
 height: 150px; 
 object-fit: cover; 
 border-radius: 6px; 
 margin-bottom: 10px; 
} 
.product-card h3 { 
 font-size: 18px; 
 margin: 8px 0; 
} 
.product-card p { 
 font-size: 14px; 
 color: #555; 
 margin: 4px 0; 
} 
.price { 
 font-weight: bold; 
 color: #007bƯ ; 
} 
@media (max-width: 1024px) { 
 .grid-container { 
 grid-template-columns: repeat(2, 1fr); 
 } 
} 
@media (max-width: 600px) { 
 .grid-container { 
 grid-template-columns: 1fr; 
 } 
} 
 </style> 
</head> 
<body> 
 <h1 class="title">Responsive Product Grid</h1> 
 <div class="grid-container"> 
 <div class="product-card"> 
 <img src="image.jpeg" alt="iphone"> 
 <h3>Product 1</h3> 
 <p>Experience the next level of performance with the new iPhone.</p> 
 <span class="price">₹120,000</span> 
 </div> 
 <div class="product-card"> 
 <img src="tv.jpeg" alt="telivision"> 
 <h3>Product 2</h3> 
 <p>Experience cinematic clarity with stunning 4K visuals.</p> 
 <span class="price">₹80,000</span> 
 </div> 
 </body> 
</html>
